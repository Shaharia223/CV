<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects-Shaharia Mahmud</title>
    <!-- line for the favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .section {
            margin-bottom: 3rem;
        }

        .projects-headline {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 2rem;
        }

        .Action-Project {
            display: flex;
            align-items: flex-start;
            gap: 30px;
            background-color: #f8f9fa;
            padding: 25px;
            margin-bottom: 4rem;
        }



        .Action-Project h3 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 1.5rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .project-item {
            background-color: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .project-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        .project-photo {
            width: 100%;
            height: 250px;
            overflow: hidden;
        }

        .project-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-content {
            padding: 20px;
        }

        .project-item h4 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        p {
            margin-bottom: 15px;
            text-align: justify;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .Action-Project {
                flex-direction: column;
            }
            
            .action-image {
                flex: none;
            }
            
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1 class="logo">Shaharia Mahmud</h1>
                <nav>
                    <ul>
                        <li><a href="index.html" class="nav-link">Home</a></li>
                        <li><a href="Projects.html" class="nav-link active">Projects</a></li>
                        <li><a href="experiences.html" class="nav-link">Experiences</a></li>
                        <li><a href="cv.html" class="nav-link">CV</a></li>
                    </ul>
                </nav>
                <!-- Mobile Menu Button -->
                <button class="mobile-menu-btn">
                    <span>☰</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main>
        <div class="section">
            <h2 class="projects-headline">Activities</h2>
            <div class="projects-grid" data-projects-section="activities"></div>
        </div>
        <div class="section">
            <h2 class="projects-headline">Current Projects</h2>
            <div class="projects-grid" data-projects-section="current"></div>
        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-name">
                    <span>Shaharia Mahmud</span>
                </div>
                <!-- Social Media Icons -->
                <div class="social-icons">
                    <!-- Email icon -->
                    <a href="https://mail.google.com/mail/?view=cm&fs=1&to=shaharia.mgrdu@gmail.com" aria-label="Email">
                        <i class="fas fa-envelope"></i>
                    </a>
                    <!-- LinkedIn icon -->
                    <a href="https://www.linkedin.com/in/shaharia-mahmud-a04a791b2/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <!-- GitHub icon -->
                    <a href="https://github.com/Shaharia223" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>
    <script src="projects.js"></script>
    <script>
        const menuBtn = document.querySelector('.mobile-menu-btn');
        const nav = document.querySelector('nav');

        menuBtn.addEventListener('click', () => {
            nav.classList.toggle('active');
        });
    </script>
</body>
</html>
